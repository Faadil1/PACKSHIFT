project: PACKSHIFT
handover_version: 0.5
active_branch: "feat/blender-master-pipeline"
base_branch: "feat/threejs-compiler-scene"

resume_from: >-
  First use the remote headless Blender worker to prove the prepared master pipeline without requiring local Blender.
  Do not replace the procedural Three.js V3 baseline until the GLB round-trip is proven. Add interactive remote Blender MCP only if it materially improves authoring.

preserve:
  - V2 production runtime on day19/vertical-slice
  - V3 procedural Three.js baseline on feat/threejs-compiler-scene
  - north star and compiled-surface thesis
  - anti-dashboard direction
  - editorial ivory visual language
  - regulatory and manufacturing truth boundaries
  - Cloudflare as preferred public runtime

central_system:
  capability: spatial_asset_and_digital_twin_engineering
  repository: Faadil1/faadil-agent-system
  pr: 26
  provider_state:
    Blender: REGISTERED_LOCAL_3D_PROVIDER
    Blender_MCP: CANDIDATE_NOT_PROMOTED

prepared_project_contract:
  - blender/README.md
  - blender/specs/PACKAGING-GEOMETRY.yaml
  - blender/specs/GLB-CONTRACT.md
  - blender/scripts/build_master.py
  - blender/scripts/validate_scene.py
  - blender/scripts/export_glb.py
  - public/models/README.md

protected_human_action:
  status: NOT_REQUIRED_FOR_HEADLESS_CI_PROOF
  action: provision_or_authorize_interactive_remote_Blender_worker_only_if_needed
  setup_guide: blender/mcp/SETUP.md
  cursor_macos_linux: blender/mcp/cursor.macos-linux.json
  cursor_windows: blender/mcp/cursor.windows.json
  first_run_prompt: blender/mcp/FIRST-RUN-PROMPT.md

benchmark_sequence:
  - connect_provider
  - execute_or_reproduce_build_master
  - validate_scene
  - save_PACKSHIFT_MASTER_blend
  - export_packshift_master_glb
  - verify_required_nodes_and_pivots
  - import_GLTF_in_React_Three_Fiber
  - bind_fold_unfold_refold_to_exported_nodes
  - test_FR_EN_data_claim_collision
  - test_desktop_and_mobile
  - exercise_one_failure_and_recovery_path
  - record_benchmark_verdict

do_not_promote_if:
  - Blender_MCP_is_only_connected_but_not_benchmarked
  - GLB_exports_but_live_runtime_breaks
  - node_or_pivot_contract_drifts
  - asset_is_only_cinematic_and_not_load_bearing
  - mobile_performance_or_legibility_regresses
  - concept_geometry_is_misrepresented_as_manufacturing_validated

exact_next_gate: "REMOTE_HEADLESS_BLENDER_PROOF -> GLB_ARTIFACT_INSPECTION -> R3F_IMPORT -> RUNTIME_QA -> OPTIONAL_REMOTE_MCP"
