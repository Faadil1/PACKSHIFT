name: Blender Headless Proof

on:
  push:
    branches:
      - main
      - feat/blender-master-pipeline
      - feat/v5-spatial-negotiation-studio
    paths:
      - 'blender/**'
      - '.github/workflows/blender-headless-proof.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  blender-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
          blender --version

      - name: Build validate and export in Blender
        run: |
          blender --background --python blender/scripts/ci_build_export.py

      - name: Validate GLB contract
        run: python3 blender/scripts/validate_glb.py

      - name: Validate closed-pose geometry
        run: python3 scripts/glb_geometry.py

      - name: Inspect generated assets
        run: |
          test -f blender/PACKSHIFT_MASTER.blend
          test -f public/models/packshift-master.glb
          ls -lh blender/PACKSHIFT_MASTER.blend public/models/packshift-master.glb
          sha256sum public/models/packshift-master.glb | tee public/models/packshift-master.glb.sha256

      - name: Upload Blender proof artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packshift-blender-master
          if-no-files-found: error
          path: |
            blender/PACKSHIFT_MASTER.blend
            public/models/packshift-master.glb.sha256
            public/models/packshift-master.glb

      - name: Promote validated GLB to branch
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/models/packshift-master.glb public/models/packshift-master.glb.sha256
          if git diff --cached --quiet; then
            echo "Validated GLB already matches branch"
          else
            git commit -m "generated(blender): update validated PACKSHIFT GLB [skip ci]"
            git push
          fi
