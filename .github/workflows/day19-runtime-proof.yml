name: Main Runtime Verify

on:
  push:
    branches:
      - main
      - day19/vertical-slice
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Build
        run: npm run build

      - name: Verify canonical GLB is packaged
        run: |
          test -f dist/models/packshift-master.glb
          sha256sum public/models/packshift-master.glb dist/models/packshift-master.glb

      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: packshift-main-dist
          path: dist
