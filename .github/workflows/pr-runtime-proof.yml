name: PR Verify

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packshift-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4

      - name: Validate GLB contract + closed-pose geometry
        run: python3 scripts/validate_glb_contract.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm ci

      - name: Unit tests (pressure model + compile solver)
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify canonical GLB is packaged
        run: |
          test -f dist/models/packshift-master.glb
          sha256sum public/models/packshift-master.glb dist/models/packshift-master.glb

      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: packshift-pr-dist
          path: dist
